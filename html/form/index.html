<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <form action="http://localhost:5500/usuarios" method="post"><br>
        <input type="email" name="email"><br> 
        <input type="password" name="senha"><br>
        <textarea name="bio" cols="30" rows="10"></textarea>
        <div>
            <input type="radio" name="tipo">Admin
            <input type="radio" name="tipo">Regular
            <input type="radio" name="tipo">Professor
        </div>
        <div>
            <input type="checkbox" name="ativo">Ativo 
        </div>
        <select name="estado">
            <option value="ac">Acre</option>
            <option value="ba">Bahia</option>
            <option value="ce">Ceará</option>
        </select>
        <button>Enviar</button>
    </form>

</body>
</html>

<style>
    input,
    textarea{
        display: block;
        margin-bottom: 1rem;
    }

    input[type=radio],
    input[type=checkbox]{
        display: inline;
    }
  
</style>
